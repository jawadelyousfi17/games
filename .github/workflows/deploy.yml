name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger metadata
        run: |
          echo "::group::Trigger info"
          echo "event       = ${{ github.event_name }}"
          echo "actor       = ${{ github.actor }}"
          echo "ref         = ${{ github.ref }}"
          echo "sha         = ${{ github.sha }}"
          echo "run id      = ${{ github.run_id }}"
          echo "run number  = ${{ github.run_number }}"
          echo "::endgroup::"

      - name: Validate required secrets
        env:
          # Reading via env: avoids the expression being inlined as an empty
          # string in the script body — the bash test then sees the real
          # value (or genuine emptiness) at runtime.
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
        run: |
          echo "::group::Secret presence check"
          echo "Repository: ${{ github.repository }}"
          echo "Triggered by: ${{ github.actor }} via ${{ github.event_name }}"
          echo "Forked PR? secrets are not exposed to PRs from forks."
          echo ""
          missing=0
          check() {
            local name=$1
            local val=${!name-}
            if [ -z "$val" ]; then
              echo "✗ $name is NOT set"
              missing=1
            else
              echo "✓ $name is set (len=${#val})"
            fi
          }
          check VPS_HOST
          check VPS_USER
          check VPS_SSH_KEY
          check DEPLOY_PATH
          check PM2_APP_NAME
          # VPS_PORT optional — informational only
          if [ -z "${VPS_PORT:-}" ]; then
            echo "· VPS_PORT not set (will default to 22)"
          else
            echo "· VPS_PORT set to ${VPS_PORT}"
          fi
          if [ "$missing" = "1" ]; then
            cat <<EOF
          ::error::Missing repository secrets. Add them at:
            https://github.com/${{ github.repository }}/settings/secrets/actions
          Make sure they are under "Repository secrets" tab — not Environment
          or Organization scope (those need extra workflow config).
          EOF
            exit 1
          fi
          echo "::endgroup::"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Bump the action's verbosity + don't cut output on long commands.
          debug: true
          command_timeout: 30m
          # script_stop:false leaves error handling to our own `set -e` so
          # the bootstrap block (which probes optional paths) doesn't trip
          # on absent directories before we're ready for strict mode.
          script_stop: false
          envs: GIT_SHA,GIT_REF,RUN_ID
          script: |
            # No `set -e` until after PATH bootstrap. When the script ran
            # under strict mode from line 1, any silent failure inside the
            # PATH-discovery block (or in the action's wrapper) killed the
            # whole script with no actionable output.
            set -o pipefail

            echo "▶ bootstrap"
            export PATH="$HOME/.nvm/versions/node/*/bin:$PATH"
            # Glob doesn't expand inside quoted assignments; do it
            # explicitly: prepend every nvm node bin we find.
            for d in "$HOME"/.nvm/versions/node/*/bin; do
              if [ -d "$d" ]; then
                export PATH="$d:$PATH"
                echo "  + $d"
              fi
            done
            # volta + asdf + common manual paths
            if [ -d "$HOME/.volta/bin" ]; then
              export PATH="$HOME/.volta/bin:$PATH"
              echo "  + $HOME/.volta/bin"
            fi
            if [ -d "$HOME/.asdf/shims" ]; then
              export PATH="$HOME/.asdf/shims:$PATH"
              echo "  + $HOME/.asdf/shims"
            fi
            for p in /usr/local/bin /usr/local/node/bin "$HOME/.local/bin" "$HOME/.npm-global/bin"; do
              if [ -d "$p" ]; then
                export PATH="$p:$PATH"
                echo "  + $p"
              fi
            done

            echo "▶ tool check"
            echo "  PATH=$PATH"
            echo "  node: $(command -v node || echo MISSING) $(node -v 2>/dev/null || true)"
            echo "  npm:  $(command -v npm  || echo MISSING) $(npm -v 2>/dev/null || true)"
            echo "  pm2:  $(command -v pm2  || echo MISSING) $(pm2 -v 2>/dev/null || true)"
            echo "  git:  $(command -v git  || echo MISSING) $(git --version 2>/dev/null || true)"
            if ! command -v npm >/dev/null; then
              echo "::error::npm not on PATH after bootstrap. PATH was: $PATH"
              exit 127
            fi

            # Strict mode + traps from here on — bootstrap is done.
            set -eu
            log() { echo -e "\n\033[1;36m▶ $*\033[0m"; }
            ok()  { echo -e "\033[1;32m✔ $*\033[0m"; }
            fail_handler() {
              local code=$?
              echo -e "\n\033[1;31m✗ deploy failed (exit $code) at line ${BASH_LINENO[0]}\033[0m"
              exit $code
            }
            trap fail_handler ERR

            log "host environment"
            uname -a
            whoami
            pwd
            echo "free disk:" ; df -h . | tail -n +1
            echo "free mem:"  ; free -h || true

            log "cd into deploy path"
            cd "${{ secrets.DEPLOY_PATH }}"
            pwd

            log "git fetch + hard reset"
            BEFORE=$(git rev-parse HEAD || echo none)
            git fetch --all --prune
            git reset --hard origin/main
            AFTER=$(git rev-parse HEAD)
            echo "before: $BEFORE"
            echo "after:  $AFTER"
            echo "diff:"
            git --no-pager log --oneline "$BEFORE..$AFTER" 2>/dev/null | head -50 || true

            log "npm ci"
            npm ci --no-audit --no-fund

            log "prisma generate"
            npx prisma generate

            log "prisma migrate status"
            npx prisma migrate status || true

            log "prisma migrate deploy"
            npx prisma migrate deploy

            log "next build"
            npm run build

            log "pm2 status (before)"
            pm2 list || true

            log "pm2 restart"
            pm2 restart "${{ secrets.PM2_APP_NAME }}" --update-env
            pm2 save

            log "pm2 status (after)"
            pm2 list

            log "tail recent pm2 logs"
            pm2 logs "${{ secrets.PM2_APP_NAME }}" --lines 30 --nostream || true

            ok "deploy complete · sha=$AFTER"
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}

      - name: Deploy summary
        if: always()
        run: |
          echo "::group::Deploy summary"
          echo "result = ${{ job.status }}"
          echo "sha    = ${{ github.sha }}"
          echo "ref    = ${{ github.ref }}"
          echo "::endgroup::"
