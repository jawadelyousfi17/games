name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # `set -e` aborts on any failed step so a half-pulled deploy
          # doesn't end up running. Each line below is independent so the
          # action's log shows exactly which step failed.
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            echo "▶ git pull"
            git fetch --all --prune
            git reset --hard origin/main
            echo "▶ install deps"
            npm ci
            echo "▶ prisma generate + migrate"
            npx prisma generate
            npx prisma migrate deploy
            echo "▶ build"
            npm run build
            echo "▶ pm2 restart"
            pm2 restart ${{ secrets.PM2_APP_NAME }} --update-env
            pm2 save
            echo "✔ deploy complete"
